name: CI - Backend Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurer les dépendances
        run: dotnet restore Backend.Tests/Backend.Tests.csproj

      - name: Build
        run: dotnet build Backend.Tests/Backend.Tests.csproj --no-restore --configuration Release

      - name: Lancer les tests
        run: dotnet test Backend.Tests/Backend.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Générer le rapport HTML de coverage
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"./TestResults/**/coverage.cobertura.xml" -targetdir:"./CoverageReport" -reporttypes:Html

      - name: Uploader le rapport de coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./CoverageReport

  sonar-analysis:
    name: SonarQube Cloud Analysis
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Installer Java (requis par le scanner Sonar)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Installer le scanner SonarQube Cloud
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restaurer les dépendances
        run: dotnet restore Backend.Tests/Backend.Tests.csproj

      - name: Démarrer l'analyse SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"filali6_axeconfigstudio" \
            /o:"filali6" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.cobertura.reportsPaths="**/TestResults/**/coverage.cobertura.xml" \
            /d:sonar.coverage.exclusions="**/*Test.cs,**/*Tests*.cs,**/Migrations/**,**/*.Designer.cs,**/Program.cs,**/Infrastructure/**,**/Models/**,**/*Model.cs,**/*Dto.cs,**/*Rule.cs,**/keycloak/**,**/wwwroot/**,**/Frontend/**" \
            /d:sonar.cpd.exclusions="**/Migrations/**"

      - name: Build
        run: dotnet build Backend.Tests/Backend.Tests.csproj --no-restore --configuration Release

      - name: Lancer les tests avec coverage
        run: dotnet test Backend.Tests/Backend.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Terminer l'analyse SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"


  docker-push:
    name: Build et push des images Docker
    needs: sonar-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push l'image Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/acportal-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/acportal-backend:${{ github.sha }}

      - name: Build et push l'image Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/acportal-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/acportal-frontend:${{ github.sha }}