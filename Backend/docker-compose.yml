services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    restart: on-failure
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    ports:
      - "8181:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_CACHE_THEME: false      
      KC_CACHE_TEMPLATES: false     
    command: start-dev --import-realm
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./acp-realm.json:/opt/keycloak/data/import/acp-realm.json
      - ./keycloak/themes:/opt/keycloak/themes

   

  dapr-zipkin:
    image: openzipkin/zipkin
    container_name: dapr-zipkin
    ports:
      - "9411:9411"
  
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  dapr-placement:
    image: daprio/dapr:1.13.0
    container_name: dapr-placement
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"

  db:
    image: postgres:16-alpine
    container_name: acportal-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acportal
    volumes:
      - acportal-db-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acp-backend
    ports:
      - "5281:5281"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5281
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=acportal;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:9093"
      Keycloak__BaseUrl: "http://keycloak:8080"
      Keycloak__PublicBaseUrl: "http://localhost:8181"
      Dapr__HttpEndpoint: "http://localhost:3500"
      Dapr__GrpcEndpoint: "http://localhost:50002"
    depends_on:
      - db
      - kafka
      - keycloak
    volumes:
      - ./uploads:/app/uploads
      - backend-dp-keys:/root/.aspnet/DataProtection-Keys

  backend-dapr:
    image: daprio/dapr:1.13.0
    container_name: backend-dapr
    restart: on-failure
    command:
      - "./daprd"
      - "-app-id"
      - "acp-backend"
      - "-app-port"
      - "5281"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50002"
      - "-placement-host-address"
      - "dapr-placement:50006"
      - "-resources-path"
      - "/components"
      - "-app-health-probe-interval"
      - "30"
      - "-log-level"
      - "info"
    volumes:
      - ./dapr/components-docker:/components
    network_mode: "service:backend"
    depends_on:
      - backend
      - dapr-placement
      - kafka
      - redis

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: acp-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  plugins-db:
    image: postgres:16-alpine
    container_name: plugins-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: plugins
      POSTGRES_PASSWORD: plugins
      POSTGRES_DB: plugins
    volumes:
      - plugins-db-data:/var/lib/postgresql/data

      
  demo-sso-plugin:
      build:
        context: ../../DemoSsoPlugin
        dockerfile: Dockerfile
      container_name: demo-sso-plugin
      ports:
        - "5300:8080"
      environment:
        Keycloak__PublicAuthority: "http://localhost:8181/realms/acp-portal"
        Keycloak__InternalAuthority: "http://keycloak:8080/realms/acp-portal"
        Keycloak__ClientId: "demo-plugin-client"
        Keycloak__ClientSecret: "Ct63V9TJtjfyU79IHBOK4fRW29SI1u9K"
        Keycloak__RequireHttpsMetadata: "false"
      depends_on:
        - keycloak
      volumes: 
        - demo-sso-plugin-keys:/root/.aspnet/DataProtection-Keys
 

  prometheus:
    image: prom/prometheus:latest
    container_name: acp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: acp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

   
  
volumes:
  
  kafka-data:
  keycloak-data:
  plugins-db-data:
  demo-sso-plugin-keys:
  acportal-db-data:
  backend-dp-keys:
  prometheus-data:
  grafana-data:
   
  
  